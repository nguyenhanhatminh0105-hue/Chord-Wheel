<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chord Wheel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0f;
      color: #e2e8f0;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    #titlebar {
      height: 32px;
      background: #0d0d0f;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }
    #titlebar span { font-size: 11px; color: #555; }
    #close-btn {
      -webkit-app-region: no-drag;
      background: #ff5f57;
      border: none;
      border-radius: 50%;
      width: 12px; height: 12px;
      cursor: pointer;
    }
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #video-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.35;
      display: none;
      z-index: 0;
    }
    #wheel-canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
    }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 3;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
    }
    #chord-name {
      font-size: 28px;
      font-weight: 700;
      color: #f97316;
      text-shadow: 0 0 20px #f9731688;
      min-height: 36px;
      letter-spacing: 2px;
    }
    #quality-label {
      font-size: 14px;
      color: #a78bfa;
      margin-top: 4px;
      min-height: 20px;
    }
    #note-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
      max-width: 200px;
    }
    .note-pill {
      background: #1e1e2e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      color: #888;
      transition: all 0.1s;
    }
    .note-pill.active {
      background: #f9731622;
      border-color: #f97316;
      color: #f97316;
      box-shadow: 0 0 8px #f9731644;
    }
    #toolbar {
      background: #0a0a10;
      border-top: 1px solid #1e1e2e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 10;
    }
    .tb-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tb-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    select, input[type=range] {
      background: #1e1e2e;
      border: 1px solid #333;
      color: #e2e8f0;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }
    select { padding: 2px 6px; cursor: pointer; }
    input[type=range] { cursor: pointer; accent-color: #f97316; width: 80px; }
    .toggle-btn {
      background: #1e1e2e;
      border: 1px solid #333;
      color: #888;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .toggle-btn.active {
      background: #f9731622;
      border-color: #f97316;
      color: #f97316;
    }
    .toggle-btn.active-purple {
      background: #a78bfa22;
      border-color: #a78bfa;
      color: #a78bfa;
    }
    .sep { width: 1px; height: 24px; background: #222; }
    #ripple-canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <span>chord-wheel</span>
    <button id="close-btn" onclick="require('electron').remote ? require('electron').remote.getCurrentWindow().close() : require('electron').ipcRenderer.send('close')"></button>
  </div>
  <div id="main">
    <video id="video-bg" autoplay muted playsinline></video>
    <canvas id="ripple-canvas"></canvas>
    <canvas id="wheel-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="hud">
      <div id="chord-name">—</div>
      <div id="quality-label"></div>
      <div id="note-pills"></div>
    </div>
  </div>
  <div id="toolbar">
    <div class="tb-group">
      <span class="tb-label">Scale</span>
      <select id="scale-select">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="pentatonic">Pentatonic</option>
        <option value="blues">Blues</option>
        <option value="dorian">Dorian</option>
        <option value="phrygian">Phrygian</option>
        <option value="lydian">Lydian</option>
        <option value="mixolydian">Mixolydian</option>
        <option value="harmonic_minor">Harm. Minor</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
      <span class="tb-label">Labels</span>
      <select id="label-select">
        <option value="sharp">Sharp</option>
        <option value="flat">Flat</option>
        <option value="solfege">Solfège</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
      <span class="tb-label">Wave</span>
      <select id="wave-select">
        <option value="sine">Sine</option>
        <option value="triangle">Triangle</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="square">Square</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
      <span class="tb-label">Atk</span>
      <input type="range" id="attack-slider" min="0.01" max="1" step="0.01" value="0.05" />
    </div>
    <div class="tb-group">
      <span class="tb-label">Rel</span>
      <input type="range" id="release-slider" min="0.1" max="4" step="0.1" value="1.2" />
    </div>
    <div class="tb-group">
      <span class="tb-label">Vol</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.6" />
    </div>
    <div class="sep"></div>
    <button class="toggle-btn" id="snap-btn">Snap</button>
    <button class="toggle-btn active-purple" id="reverb-btn">Reverb</button>
    <button class="toggle-btn" id="cam-btn">📷 Cam</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
