<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Wheel</title>
  <meta name="description" content="Explore and play chords on two wheels, with the mouse, the keyboard or your hands in front of a webcam." />
  <meta name="theme-color" content="#0d0d0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23a78bfa' stroke-width='5'/%3E%3Cpath d='M16 6a10 10 0 0 1 8.66 5' fill='none' stroke='%23f97316' stroke-width='5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="titlebar">
    <h1>Chord Wheel</h1>
    <a class="source" href="https://github.com/nguyenhanhatminh0105-hue/Chord-Wheel">Source</a>
    <button id="close-btn" type="button" aria-label="Close"></button>
  </header>

  <main id="main">
    <video id="video-bg" autoplay muted playsinline></video>
    <canvas id="ripple-canvas"></canvas>
    <canvas id="wheel-canvas" role="img" aria-label="Two wheels: twelve root notes on the left, ten chord qualities on the right"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="hud" class="idle" aria-live="polite">
      <div id="chord-name"></div>
      <div id="quality-label"></div>
      <div id="note-pills"></div>
      <div id="hint">
        <p class="hint-lead">Hold a note</p>
        <p class="hint-mouse">Change the chord on the right wheel while it sounds.</p>
        <p class="hint-keys"><span><kbd>A</kbd> to <kbd>J</kbd> play notes,</span> <span><kbd>1</kbd> to <kbd>0</kbd> pick the chord.</span></p>
      </div>
      <p id="notice"></p>
    </div>
  </main>

  <footer id="toolbar">
    <div class="tb-section">
      <label class="tb-group">
        <span class="tb-label">Key</span>
        <select id="key-select"></select>
      </label>
      <label class="tb-group">
        <span class="tb-label">Scale</span>
        <select id="scale-select">
          <option value="major">Major</option>
          <option value="minor">Minor</option>
          <option value="pentatonic">Pentatonic</option>
          <option value="blues">Blues</option>
          <option value="dorian">Dorian</option>
          <option value="phrygian">Phrygian</option>
          <option value="lydian">Lydian</option>
          <option value="mixolydian">Mixolydian</option>
          <option value="harmonic_minor">Harmonic minor</option>
        </select>
      </label>
      <button class="toggle-btn" id="snap-btn" type="button" aria-pressed="false" title="Only notes in the scale can be played">Snap to scale</button>
      <label class="tb-group">
        <span class="tb-label">Labels</span>
        <select id="label-select">
          <option value="sharp">Sharp</option>
          <option value="flat">Flat</option>
          <option value="solfege">Solfège</option>
        </select>
      </label>
    </div>

    <div class="tb-section">
      <label class="tb-group">
        <span class="tb-label">Wave</span>
        <select id="wave-select">
          <option value="sine">Sine</option>
          <option value="triangle">Triangle</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="square">Square</option>
        </select>
      </label>
      <label class="tb-group">
        <span class="tb-label">Attack</span>
        <input type="range" id="attack-slider" min="0.01" max="1" step="0.01" value="0.05" />
      </label>
      <label class="tb-group">
        <span class="tb-label">Release</span>
        <input type="range" id="release-slider" min="0.1" max="4" step="0.1" value="1.2" />
      </label>
      <label class="tb-group">
        <span class="tb-label">Volume</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.6" />
      </label>
      <button class="toggle-btn purple" id="reverb-btn" type="button" aria-pressed="true">Reverb</button>
    </div>

    <div class="tb-section">
      <button class="toggle-btn" id="cam-btn" type="button" aria-pressed="false" title="Play with your hands in front of the webcam">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5h9.5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM13.5 9l4.5-2.5v7L13.5 11"/></svg>
        Hand tracking
      </button>
    </div>
  </footer>

  <script src="theory.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
